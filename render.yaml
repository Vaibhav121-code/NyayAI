services:
  - type: web
    name: nyayai-demo
    runtime: python
    plan: free
    buildCommand: pip install --no-cache-dir -r requirements-render.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/status
    envVars:
      - key: CHROMA_DIR
        value: /tmp/nyayai/chroma
      - key: INGESTION_COLLECTION_NAME
        value: nyaai_judgments_v2
